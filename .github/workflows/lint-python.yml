# https://beta.ruff.rs
name: ruff
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  ruff:
    runs-on: ubuntu-latest-large
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3
      - run: pip install --user ruff
      - run: ruff check --ignore="E722,F40,F841" --line-length=320 --target-version=py37 .
