name: Test and Deploy
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-x64
    if: github.repository_owner == 'sendgrid'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13' ]
    steps:
      - name: Checkout sendgrid-python
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e # v1
        with:
          ecosystem: python

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build & Test
        run: make test

  deploy:
    name: Deploy
    if: success() && github.ref_type == 'tag' && github.repository_owner == 'sendgrid'
    needs: [ test ]
    runs-on: ubuntu-x64
    environment:
      name: production
      url: https://pypi.org/project/sendgrid/${{ github.ref_name }}
    permissions:
      contents: write          # required for creating GitHub Release
      id-token: write
      attestations: write
    steps:
      - name: Checkout sendgrid-python
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release action verifies refs/tags/<tag> in the local clone.
          fetch-depth: 0

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e # v1
        with:
          ecosystem: python

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate tag format and version match
        run: |
          pip install setuptools
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Release tag must look like 1.2.3 or v1.2.3 (got '$TAG')"
            exit 1
          fi
          PKG_VERSION=$(python setup.py --version)
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match setup.py version $PKG_VERSION"
            exit 1
          fi

      - name: Build package
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Create GitHub Release
        uses: twilio/sdk-actions/github-release@9b1c3222c9ffe38aadedb11c5b9f5a172b5e9951 # v1
        with:
          changelog-file: CHANGELOG.md
          footer: '**[PyPI](https://pypi.org/project/sendgrid/${{ github.ref_name }})**'

      # PyPI trusted publishing (OIDC) - no API token. A trusted publisher must be
      # configured on pypi.org for this repo and workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1

#      - name: Submit metric to Datadog
